<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hybrid PPL Tracker</title>
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; splits color-coded like Olympic plates (25 red, 20 blue, 15 yellow, 10 green). */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#F2F2F7; --seg:#E5E5EA; --track:#E5E5EA; --ink:#000000; --muted:#6C6C70; --line:#E5E5EA;
  --push:#E0103F; --pull:#0A6CFF; --legs:#E58A00; --home:#2DB84D; --accent:#FA114F;
  --ok:#2DB84D; --warn:#C77700; --on-accent:#FFFFFF; --on-legs:#FFFFFF;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --seg:#2C2C2E; --track:#3A3A3C; --ink:#FFFFFF; --muted:#8E8E93; --line:#2C2C2E;
  --push:#FA114F; --pull:#0A84FF; --legs:#FF9F0A; --home:#92E82A; --ok:#92E82A; --warn:#FFB340; --on-accent:#FFFFFF; --on-legs:#1A1406; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --seg:#2C2C2E; --track:#3A3A3C; --ink:#FFFFFF; --muted:#8E8E93; --line:#2C2C2E;
  --push:#FA114F; --pull:#0A84FF; --legs:#FF9F0A; --home:#92E82A; --ok:#92E82A; --warn:#FFB340; --on-accent:#FFFFFF; --on-legs:#1A1406; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.edge{border-left:5px solid var(--c,var(--line))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pill.due{color:var(--on-accent);background:var(--c,var(--pull));border-color:transparent}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--c,var(--ink));color:var(--on-accent);border-color:transparent}
.btn.primary.legs{color:var(--on-legs)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pull);outline-offset:2px}
a{color:var(--pull)}
.link{font-size:13px;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}
input[type=number],input[type=text],input[type=date],select{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 8px;min-height:38px;width:100%;min-width:0}
input[type=number]{text-align:center}
select{padding-right:4px}

/* plate badge */
.plate{--s:44px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;position:relative;color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:14px}
.plate::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.plate span{position:absolute;top:3px;font-size:10px;letter-spacing:.04em}
.plate.legs{color:var(--on-legs)}

.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;align-items:center}
.set.one{grid-template-columns:34px 1fr 44px}
.set .lab{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.chk{width:44px;height:38px;border-radius:7px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.grid10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid10 .cell{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.hint{font-size:13px;padding:8px 10px;border-radius:7px;background:var(--sunk);border:1px dashed var(--line)}
.hint.good{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.check-item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.check-item.done .name{text-decoration:line-through;color:var(--muted)}
.name{font-weight:600}
.dose{font-family:var(--display);font-weight:600;font-size:16px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-weight:600;cursor:pointer;min-width:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.chart{width:100%;height:auto;display:block}
textarea{width:100%;min-height:140px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
details summary{cursor:pointer;font-weight:600}
.logitem{display:flex;gap:10px;align-items:flex-start}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin-top:5px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 2px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-top-color:var(--ink)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgb(0 0 0 / .25);max-width:calc(100% - 32px)}
.timer{flex-wrap:nowrap;white-space:nowrap;gap:8px}
.timer button{white-space:nowrap}
.timer b{font-family:var(--display);font-size:24px;min-width:64px}
.timer button{background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:9;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.streak{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-align:right}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.cal button.d{background:transparent;font:inherit;font-weight:600;padding:0;cursor:pointer}
.cal .d.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--pull) 55%,transparent)}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid var(--line);color:var(--muted)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:2px}
.cal .d.future{opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--home);vertical-align:-2px;margin-right:5px}
.btn.big{background:var(--ink);color:var(--bg);border:0;min-height:56px;font-size:18px;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;width:100%}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--home)}
.sheet{position:fixed;inset:0;z-index:8;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end}
.sheet>div{background:var(--surface);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.btn.opt{display:flex;align-items:center;justify-content:space-between;text-align:left;border-left:6px solid var(--c);min-height:48px}
/* ===== Rings look: rounded cards, ring calendar, pill buttons, system font ===== */
body{font-size:16px}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;text-transform:none;line-height:1.1}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
.eyebrow{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.06em}
.big{text-transform:none;font-size:34px;font-weight:800;letter-spacing:-.02em}
.dose{font-family:var(--body);font-weight:700;font-size:15px}
.card{border:0;border-radius:22px;padding:16px}
.card.edge{border-left:0}.card.edge .eyebrow{color:var(--c)}
.pill{border:0;background:var(--sunk)}
.btn{border:0;background:var(--sunk);border-radius:14px;min-height:44px;font-weight:700}
.btn:hover{border-color:transparent}
.btn.primary{background:var(--c,var(--accent));border-radius:99px;color:var(--on-accent)}
.btn.primary.legs{color:var(--on-legs)}
.btn.primary.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;border-radius:99px;padding:5px 14px}
.btn.big{background:var(--accent);color:#fff;border-radius:99px;font-family:var(--display);font-weight:800;text-transform:none;letter-spacing:0;font-size:18px}
.btn.opt{border-radius:14px}
input[type=number],input[type=text],input[type=date],select,textarea{border:0;border-radius:12px;background:var(--sunk)}
.card input[type=number],.card input[type=text],.card input[type=date],.card select,.card textarea{background:var(--sunk)}
.chk{border:0;border-radius:12px;background:var(--sunk)}
.chk.on{background:var(--ok);color:var(--on-accent)}
.seg{border:0;border-radius:14px;background:var(--seg);padding:3px;gap:3px;overflow:visible}
.seg button{background:transparent;border-radius:11px;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.hint{border:0;border-radius:12px}
.bar{height:10px;border-radius:99px}.bar i{background:linear-gradient(90deg,var(--accent),#FF9F0A);border-radius:99px}
.streak{color:var(--accent)}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:0}
nav.tabs button{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.04em}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.sheet>div{border-radius:24px 24px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 26px/1.1 var(--display);letter-spacing:-.02em}
.badge{font-weight:800;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--sunk)}
.badge.E{color:var(--ok)}.badge.J{color:var(--muted)}
.cal button.d{border:0;color:var(--muted);background:radial-gradient(circle,var(--fill,var(--surface)) 58%,transparent 59%),conic-gradient(var(--s,var(--track)) 0deg 172deg,transparent 172deg 180deg,var(--r,var(--track)) 180deg 352deg,transparent 352deg)}
.cal .d.full{color:var(--ink);font-weight:800}
.cal .d.today{outline:0;box-shadow:0 0 0 2px var(--ink)}
.cal .d.sel{box-shadow:0 0 0 3px var(--pull)}
.cal .d.future{opacity:.4}
.legend i{border:0}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="stack" style="gap:2px">
      <span class="eyebrow" id="hdr-date">Training</span>
      <h1 id="hdr-title">Today</h1>
    </div>
    <span class="pill" id="sync">Loading…</span>
  </header>
  <main id="main"><div class="card"><p class="muted">Loading your program and history…</p></div></main>
</div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>
/* ================= PROGRAM ================= */
const SPLITS = {
  push:{name:"Push",plate:25,c:"--push"},
  pull:{name:"Pull",plate:20,c:"--pull"},
  legs:{name:"Legs",plate:15,c:"--legs"},
};
const ORDER=["push","pull","legs"];
const L=(n,k)=>({n,k}); // option with kind override
const PROGRAM = {
  warmup:[
    ["Band pull-aparts","2 × 15"],
    ["Scapular pull-ups","1 × 10"],["Wrist circles and floor rocks","1 min"]
  ],
  push:[
    {id:"skill",label:"Skill",kind:"skill",skill:"planche"},
    {id:"leans",label:"Planche leans",kind:"hold",sets:3,range:"15–20 s",rest:90,opts:["Planche lean"]},
    {id:"c1",label:"Compound 1",kind:"lift",sets:3,range:"6–10",lo:6,hi:10,rest:150,opts:["Bench press","Weighted dips","Incline bench press","Dips"]},
    {id:"c2",label:"Compound 2",kind:"lift",sets:3,range:"8–10",lo:8,hi:10,rest:120,opts:["Overhead press","Dumbbell shoulder press","Machine shoulder press"]},
    {id:"lat",label:"Lateral raises",kind:"lift",sets:3,range:"12–15",lo:12,hi:15,rest:60,opts:["Cable lateral raise","Dumbbell lateral raise"]},
    {id:"t1",label:"Triceps 1",kind:"lift",sets:3,range:"10–15",lo:10,hi:15,rest:75,opts:["Overhead cable extension","Dumbbell overhead extension","Skull crusher"]},
    {id:"t2",label:"Triceps 2",kind:"lift",sets:3,range:"10–12",lo:10,hi:12,rest:75,opts:["Rope pushdown","Bar pushdown","Skull crusher"]},
    {id:"core",label:"Core · anti-extension",kind:"reps",sets:3,range:"8–12 reps / 20–30 s",rest:60,cut:3,opts:[L("Ab wheel","reps"),L("Hollow body hold","hold")]},
    {id:"grip",label:"Grip",kind:"hold",sets:2,range:"near max",rest:90,opts:["Thick-bar hang"]},
  ],
  pull:[
    {id:"skill",label:"Skill",kind:"skill",skill:"handstand"},
    {id:"r1",label:"Row 1",kind:"lift",sets:3,range:"8–10",lo:8,hi:10,rest:120,opts:["Chest-supported row","Barbell row","T-bar row"]},
    {id:"r2",label:"Row 2",kind:"lift",sets:3,range:"10–12",lo:10,hi:12,rest:90,opts:["One-arm cable row","One-arm dumbbell row","Seated cable row"]},
    {id:"fp",label:"Face pulls",kind:"lift",sets:3,range:"15",lo:15,hi:15,rest:60,opts:["Face pull"]},
    {id:"rd",label:"Rear delts",kind:"lift",sets:2,range:"15",lo:15,hi:15,rest:60,cut:1,opts:["Cable rear delt fly","Reverse pec deck","Dumbbell rear delt fly"]},
    {id:"b1",label:"Biceps 1",kind:"lift",sets:3,range:"10–12",lo:10,hi:12,rest:75,opts:["Incline dumbbell curl","Bayesian cable curl","Barbell curl"]},
    {id:"b2",label:"Biceps 2",kind:"lift",sets:3,range:"10–12",lo:10,hi:12,rest:75,opts:["Hammer curl","Preacher curl","Cable curl"]},
    {id:"core",label:"Core",kind:"reps",sets:3,range:"8–12",rest:60,cut:3,opts:[L("Hanging leg raise (curl pelvis up)","reps"),L("Cable crunch","reps")]},
    {id:"oah",label:"One-arm hangs",kind:"hold",sets:3,side:true,range:"3 per side",rest:60,opts:["One-arm dead hang"]},
  ],
  legs:[
    {id:"skill",label:"Skill",kind:"skill",skill:"frontlever"},
    {id:"sq",label:"Squat",kind:"lift",sets:3,range:"6–10, full depth",lo:6,hi:10,rest:150,opts:["Hack squat","Back squat","Leg press"]},
    {id:"rdl",label:"Hinge",kind:"lift",sets:3,range:"8–10",lo:8,hi:10,rest:120,opts:["Romanian deadlift","Dumbbell RDL","Back extension"]},
    {id:"split",label:"Single leg",kind:"lift",sets:2,side:true,range:"8–10 per side",lo:8,hi:10,rest:90,opts:["Bulgarian split squat","Single-leg RDL"]},
    {id:"curl",label:"Hamstrings",kind:"lift",sets:3,range:"6–10",lo:6,hi:10,rest:90,opts:["Nordic curl","Lying leg curl","Seated leg curl"]},
    {id:"quad",label:"Quads",kind:"lift",sets:2,range:"12",lo:12,hi:12,rest:75,opts:["Sissy squat","Leg extension"]},
    {id:"add",label:"Adductors",kind:"lift",sets:2,range:"12, full stretch",lo:12,hi:12,rest:60,cut:2,opts:["Adductor machine","Copenhagen plank"]},
    {id:"calf",label:"Calves",kind:"lift",sets:3,range:"10–15, pause at bottom",lo:10,hi:15,rest:60,opts:["Standing calf raise","Seated calf raise"]},
    {id:"tib",label:"Tibialis",kind:"lift",sets:3,range:"15–20",lo:15,hi:20,rest:45,opts:["Tibialis raise","Tibialis raise with ball (doctor's version)"]},
    {id:"core",label:"Core · anti-rotation",kind:"reps",sets:2,range:"10 per side / 30 s",rest:45,cut:3,opts:[L("Pallof press","reps"),L("Side plank","hold")]},
    {id:"oah",label:"One-arm hangs",kind:"hold",sets:3,side:true,range:"3 per side",rest:60,opts:["One-arm dead hang"]},
  ],
  home:[
    {id:"wangel",n:"Wall angels",dose:"1 × 10",why:"Upper back and shoulder posture. Back, head and hips against the wall, slide the arms up and down.",t:0},
    {id:"chin",n:"Chin tucks",dose:"1 × 10",why:"Neck posture. Draw the chin straight back, hold 2 s each rep.",t:0},
    {id:"couch",n:"Couch stretch",dose:"2 × 45 s per side",why:"Hip flexors and quads. Knee against the wall, squeeze the glute of the back leg.",t:45},
    {id:"9090",n:"90/90 hip switches",dose:"10 slow switches + 30 s hold per side",why:"Hip rotation both ways. Lean your chest over the front shin for the hold.",t:30},
    {id:"pigeon",n:"Pigeon stretch",dose:"2 × 45 s per side",why:"Glutes and hip rotators. Figure-4 on your back if pigeon hurts the knee.",t:45},
    {id:"frog",n:"Frog stretch / adductor rock-backs",dose:"10 rocks + 30 s hold",why:"Inner thighs: the pelvis opening the doctor asked for.",t:30},
    {id:"squat",n:"Deep squat hold",dose:"2 × 60 s",why:"Hips and ankles together. Hold a door frame, heels down.",t:60},
    {id:"deadbug",n:"Dead bug",dose:"2 × 8 per side",why:"Lower back flat on the floor the whole time: posterior pelvic tilt control.",t:0},
  ]
};
const SKILLS = {
  planche:{name:"Planche",levels:["Tuck","Advanced tuck","Straddle","Full"]},
  frontlever:{name:"Front lever",levels:["Tuck","Advanced tuck","One leg","Straddle","Full"]},
  handstand:{name:"Handstand",levels:["Chest-to-wall","Freestanding (kick-up)","Freestanding (clean entry)"]},
};

async function putLog(log){
  const i=LOGS.findIndex(l=>l.id===log.id); if(i>=0)LOGS[i]=log; else LOGS.push(log); sortLogs();
  if(mode==="db"){try{await logsCol.doc(log.id).set(clone(log))}catch(e){toast(e?.code==="quota_exceeded"?"Storage is full. Export and delete old entries.":"Couldn't save. Check your connection.")}}

let tEnd=0,tLabel="",tInt=null,actx=null;
function startTimer(sec,label){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch{}
  tEnd=Date.now()+sec*1000;tLabel=label||"Rest";clearInterval(tInt);tInt=setInterval(tick,250);tick();
}
function tick(){
  const el=$("#timer");const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  el.hidden=false;el.innerHTML=`<span class="small">${esc(tLabel)}</span><b>${Math.floor(left/60)}:${pad(left%60)}</b><button data-a="timer-add">+30 s</button><button data-a="timer-stop">${left?"Stop":"Done"}</button>`;
  if(!left){clearInterval(tInt);tInt=null;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}
}
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch{}}
let toastT=null;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function dayDetail(ds){

  L.filter(l=>l.type==="session").forEach(l=>parts.push(`${SPLITS[l.split].name} day${l.min?` (${l.min} min)`:""}`));
  L.filter(l=>l.type==="pullup").forEach(l=>parts.push(`Pull-ups: ${PU_DAYS[l.day].name}${l.approx?" (approx.)":""}`));
  L.filter(l=>l.type==="run").forEach(l=>parts.push(`Run ${l.km} km`));
  const train=parts.length;
  if(!train)parts.push(ds>today()?"Nothing yet":"Rest day");
  const h=L.find(l=>l.type==="home"),n=h?(h.done||[]).length:0;
  if(ds<=today())parts.push(n?`Home routine ${n}/${PROGRAM.home.length}`:"No home routine");

  for(const c of (S.custom.mine||[]))if(!m.has(c.n))m.set(c.n,{n:c.n,k:c.k,cat:c.cat,key:"mine",sets:3,range:"",rest:90});

function migrateDraft(d){
  if(!d||d.order)return d;
  const out={split:d.split,started:d.started,date:d.date,warm:[],order:[],slots:{}};
  for(const sl of (PROGRAM[d.split]||[])){
    const st=d.slots&&d.slots[sl.id];
    if(!st||!(st.sets||[]).some(x=>x.done||x.r||x.s||x.w))continue;
    const id=uid()+out.order.length;
    if(sl.kind==="skill"){st.def={key:"skill-"+sl.skill,skill:sl.skill,label:"Skill",kind:"skill"}}
    else{const o=sl.opts.map(o=>typeof o==="string"?{n:o,k:sl.kind}:o).find(o=>o.n===st.ex);st.def={key:sl.id,label:sl.label,kind:o?o.k:sl.kind,sets:sl.sets,range:sl.range,lo:sl.lo,hi:sl.hi,rest:sl.rest,side:sl.side}}

}

function puChart(hist){

  const W=600,rowH=70,pad0=150,H=rows.length*rowH+8;
  const colors={max:"var(--ink)",density:"var(--pull)",pyramid:"var(--home)"};
  let g="";
  rows.forEach((r,ri)=>{
    const y0=ri*rowH+8, vals=r.pts.map(puLogTotal), mx=Math.max(1,...vals);
    g+=`<text x="0" y="${y0+22}" fill="var(--ink)" font-size="21" font-weight="600" font-family="-apple-system,system-ui,sans-serif">${PU_DAYS[r.day].name.toUpperCase()}</text>`;
    g+=`<line x1="${pad0}" x2="${W}" y1="${y0+54}" y2="${y0+54}" stroke="var(--line)"/>`;
    if(!vals.length){g+=`<text x="${pad0}" y="${y0+40}" fill="var(--muted)" font-size="17">No sessions yet</text>`;return}
    const bw=Math.min(44,(W-pad0)/10-8);

      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${colors[r.day]}" opacity="${lastOne?1:.45}"/><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" fill="var(--muted)" font-size="17">${v}</text>`});
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total reps per pull-up session, by day type">${g}</svg><div class="muted small">Weeks 1–3 come from your notes; their dates are approximate.</div>`;
}

/* ---------- Analytics ---------- */
const MS=864e5, tsOf=ds=>Date.parse(ds+"T12:00:00");
const shortD=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
function weekStart(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)}
function lastWeeks(n){const o=[],d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-7*i);o.push(dstr(x))}return o}
function lineChart(pts,o={}){
  if(!pts.length)return `<div class="muted small">No data yet.</div>`;
  const W=420,H=190,L=34,R=12,T=16,B=28,col=o.color||"var(--accent)";
  let x0=Math.min(...pts.map(p=>p.t)),x1=Math.max(...pts.map(p=>p.t));if(x0===x1){x0-=MS*3;x1+=MS*3}
  let y0=o.zero?0:Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));if(y0===y1){y0=Math.max(0,y0-1);y1+=1}
  const pad=(y1-y0)*.14;if(!o.zero)y0-=pad;y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B),r1=v=>Math.round(v*10)/10;
  let g="";[y0,(y0+y1)/2,y1].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="12">${r1(v)}</text>`});
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(p.t)},${Y(p.y)}`).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Chart")}">${g}<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="3.5" fill="${col}"/>`).join("")}
  <text x="${Math.min(W-R,X(last.t)+6)}" y="${Y(last.y)-9}" text-anchor="end" fill="var(--ink)" font-size="14" font-weight="700">${r1(last.y)}${o.unit||""}</text>
  <text x="${L}" y="${H-7}" fill="var(--muted)" font-size="12">${shortD(x0===pts[0].t?x0:Math.min(...pts.map(p=>p.t)))}</text><text x="${W-R}" y="${H-7}" text-anchor="end" fill="var(--muted)" font-size="12">${shortD(Math.max(...pts.map(p=>p.t)))}</text></svg>`;
}
function barChart(items,o={}){
  const W=420,H=170,T=20,B=26,n=items.length,mx=Math.max(1,...items.map(i=>i.v)),bw=Math.min(34,(W-16)/n-8),col=o.color||"var(--accent)";
  const step=(W-16)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Chart")}">${items.map((it,i)=>{const h=it.v?Math.max(3,it.v/mx*(H-T-B)):0,x=8+i*step+(step-bw)/2,y=H-B-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${col}" opacity="${i===n-1?1:.55}"/>${it.v?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="700">${Math.round(it.v*10)/10}</text>`:""}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="12">${esc(it.l)}</text>`}).join("")}</svg>`;
}
const CAT_RX=[["Core",/wheel|crunch|plank|hollow|leg raise|pallof/i],["Triceps",/tricep|skull|pushdown|close-grip/i],["Legs",/leg curl|leg extension|squat|deadlift|romanian|\brdl\b|thrust|lunge|calf|tibialis|nordic|adductor|copenhagen/i],["Biceps",/curl/i],["Shoulders",/lateral|overhead press|shoulder press|military/i],["Back",/row|face pull|rear delt|pec deck|y-raise|pulldown|pull-up/i],["Chest",/bench|press|fly|dip|push-up/i],["Skills & holds",/planche|lever|handstand|hang|lean/i]];
function catOfEx(n){const c=catalog().find(e=>e.n===n);if(c)return c.cat;for(const [k,rx] of CAT_RX)if(rx.test(n))return k;return "Other"}
function activeSets(){const t={},r={},p={};const d=dayMap();return new Set([...Object.keys(d.t),...Object.keys(d.r),...Object.keys(d.p)])}
function longestStreak(){const ds=[...activeSets()].sort();let best=0,cur=0,prev=null;for(const x of ds){cur=prev&&Math.round((tsOf(x)-tsOf(prev))/MS)===1?cur+1:1;best=Math.max(best,cur);prev=x}return best}
function stat(v,l){return `<div class="stat"><b>${v}</b><span class="muted small">${l}</span></div>`}
function anOverview(){
  const mo=today().slice(0,7),inMo=l=>l.date.startsWith(mo),dm=dayMap();
  const sess=LOGS.filter(l=>l.type==="session"&&inMo(l)).length,km=LOGS.filter(l=>l.type==="run"&&inMo(l)).reduce((a,l)=>a+(+l.km||0),0);
  const pud=Object.keys(dm.p).filter(x=>x.startsWith(mo)).length,rod=Object.keys(dm.r).filter(x=>x.startsWith(mo)).length;
  const wk=lastWeeks(8);
  const sw=wk.map(w=>({l:shortD(tsOf(w)),v:LOGS.filter(l=>l.type==="session"&&weekStart(l.date)===w).length}));
  const kw=wk.map(w=>({l:shortD(tsOf(w)),v:LOGS.filter(l=>l.type==="run"&&weekStart(l.date)===w).reduce((a,l)=>a+(+l.km||0),0)}));
  const stw=wk.map(w=>({l:shortD(tsOf(w)),v:LOGS.filter(l=>l.type==="session"&&weekStart(l.date)===w).reduce((a,l)=>a+(l.items||[]).reduce((b,i)=>b+(i.sets||[]).length,0),0)}));
  // sets per muscle group: this week vs average of previous 4 weeks
  const cats={},w0=wk[wk.length-1],prev=wk.slice(-5,-1);
  for(const l of LOGS)if(l.type==="session"){const ws=weekStart(l.date);for(const it of l.items||[]){const c=catOfEx(it.ex);cats[c]=cats[c]||{now:0,prev:0};if(ws===w0)cats[c].now+=(it.sets||[]).length;else if(prev.includes(ws))cats[c].prev+=(it.sets||[]).length/4}}
  const rows=Object.keys(cats).sort((a,b)=>cats[b].now+cats[b].prev-cats[a].now-cats[a].prev),mx=Math.max(1,...rows.map(c=>Math.max(cats[c].now,cats[c].prev)));
  return `<section class="card"><span class="eyebrow">This month</span><div class="stats">${stat(sess,"Sessions")}${stat(Math.round(km*10)/10,"Run km")}${stat(pud,"Pull-up days")}${stat(rod,"Routine days")}${stat(streakDays(),"Current streak")}${stat(longestStreak(),"Longest streak")}</div></section>
  <section class="card"><span class="eyebrow">Sessions per week</span>${barChart(sw,{label:"Sessions per week"})}</section>

function skillPts(k){
  const nm=SKILLS[k].name,lv=SKILLS[k].levels[S.skills[k].level],key=nm+" · "+lv,pts=[];

function histCard(list,title){
  const items=list.slice(0,80).map(l=>{
    let c="--muted",title="",detail="";
    if(l.type==="session"){c=SPLITS[l.split].c;title=SPLITS[l.split].name;detail=(l.items||[]).map(i=>`${i.ex}: ${fmtSets(i)}`).join(" · ")}
    else if(l.type==="pullup"){c="--pull";title="Pull-ups · "+PU_DAYS[l.day].name;detail=l.day==="pyramid"?l.ladders.map(x=>`${x.peak}${x.clean?"":"✗"}`).join(" / ")+` = ${puLogTotal(l)} reps`:`${l.sets.join(" · ")} = ${puLogTotal(l)} reps`;if(l.note)detail+=" · "+l.note}
    else if(l.type==="home"){c="--home";title="Home routine";detail=`${(l.done||[]).length}/${PROGRAM.home.length} done`}
    else if(l.type==="run"){c="--warn";title=`Run · ${l.km} km`;detail=[l.min?`${l.min} min`:"",l.shin?"shins hurt":"",l.note||""].filter(Boolean).join(" · ")}
    else if(l.type==="weight"){c="--muted";title=`Weight · ${l.kg} kg`}

    return `<div class="logitem"><span class="dot" style="--c:var(${c})"></span><div style="min-width:0;flex:1"><div class="row between"><b>${esc(title)}</b><span class="muted small">${fmtDate(l.date)}${l.approx?" (approx.)":""}</span></div><div class="muted small" style="overflow-wrap:anywhere">${esc(detail)}</div></div>${l.seed||l.id.startsWith("seed")?"":`<button class="btn sm ghost" data-a="del" data-id="${l.id}" aria-label="Delete entry">${confirmKey==="del-"+l.id?"Confirm":"✕"}</button>`}</div>`}).join("<hr>");

}

function doseOf(e){return e.dose||(e.sets&&e.reps?`${e.sets} × ${e.reps}`:(e.sets||e.reps))}
function loadProgramDay(id){
  const d=PROGRAMS.days.find(x=>x.id===id);if(!d)return;
  const ns=newSession(d.split);ns.day=d.name;
  d.ex.forEach(e=>{
    const sid=uid()+ns.order.length;
    if(e.skill)ns.slots[sid]=makeSlot({skill:e.skill});
    else{const m=/^(\d+)–(\d+)$/.exec(e.reps),kind=e.kind||"lift";
      ns.slots[sid]=makeSlot({n:e.name,k:kind,cat:d.name,key:e.key||"prog",sets:e.n,range:e.reps,side:!!e.side,lo:kind==="lift"&&m?+m[1]:undefined,hi:kind==="lift"&&m?+m[2]:undefined,rest:90})}
    ns.order.push(sid);
  });
  session=ns;pick=null;tab="session";confirmKey=null;saveDraft();render();window.scrollTo(0,0);
}
function exCard(e){
  return `<section class="card"><div class="row between"><b>${esc(e.name)}</b><span class="badge ${e.tag}">[${e.tag}]</span></div>
    <div class="dose">${esc(doseOf(e))} <span class="muted small">· ${esc(e.rest)}</span></div>
    <div class="muted small">${esc(e.why)}</div></section>`;
}
function viewPrograms(){
  const day=PROGRAMS.days.find(d=>d.id===progDay);
  if(day)return `<section class="card edge" style="--c:${cvar(day.split)}"><span class="eyebrow">${esc(SPLITS[day.split].name)} day</span><h2>${esc(day.name)}</h2><div class="muted">${esc(day.emphasis)}</div></section>
  ${day.ex.map(exCard).join("")}
  <button class="btn big" data-a="load-prog" data-k="${day.id}">${session&&confirmKey==="load-"+day.id?"Tap again to replace the session in progress":"Load into session"}</button>`;
  return `<details class="card"><summary><b>General rules</b></summary><ul class="muted small" style="margin:8px 0 0;padding-left:18px">${PROGRAMS.general.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>
  <details class="card"><summary><b>Pull-up day adjustments</b></summary><ul class="muted small" style="margin:8px 0 0;padding-left:18px">${PROGRAMS.pullups.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>
  ${PROGRAMS.days.map(d=>`<button class="btn" style="display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:60px;border-left:6px solid ${cvar(d.split)}" data-a="prog-day" data-k="${d.id}"><span><b>${esc(d.name)}</b><br><span class="muted small">${esc(d.emphasis)}</span></span><span class="muted">›</span></button>`).join("")}`;
}
function viewMore(){
  if(moreSub==="measure")return `<div class="stack">${backBtn()}${viewMeasure()}</div>`;
  if(moreSub==="records")return `<div class="stack">${backBtn()}${viewRecords()}</div>`;
  if(moreSub==="program")return `<div class="stack">${progDay?`<div><button class="btn sm ghost" data-a="prog-day" data-k="">‹ All programs</button></div>`:backBtn()}${viewPrograms()}</div>`;
  if(moreSub==="log")return `<div class="stack">${backBtn()}${viewLog()}</div>`;
  if(moreSub==="backup")return `<div class="stack">${backBtn()}${backupCard()}</div>`;
  const w=lastOf("weight");
  const row=(k,t,d)=>`<button class="btn" style="display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:56px" data-a="more-go" data-k="${k}"><span><b>${t}</b><br><span class="muted small">${d}</span></span><span class="muted">›</span></button>`;
  return `<div class="stack">
  ${row("measure","Measurements",w?`${w.kg} kg on ${fmtDate(w.date)}${S.metrics.height?` · ${S.metrics.height} cm`:""}`:"Body weight and height")}
  ${row("program","Programs","Push A/B, Pull A/B, Legs A/B")}
  ${row("records","Records","Skill holds and lift max strength")}
  ${row("log","Activity log","Everything you have logged")}
  ${row("backup","Backup and restore","Keep your data safe")}
  <div class="muted small" style="text-align:center">App version ${APP_VERSION}</div>
  </div>`;
}
/* ================= EVENTS ================= */
document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const i=+t.dataset.i;
  if(session&&t.dataset.slot&&["w","r","s"].includes(f)){session.slots[t.dataset.slot].sets[i][f]=t.value;saveDraft();return}
  if(f==="test"){session.slots[t.dataset.slot].testVal=t.value;saveDraft();return}
  if(f==="pumax"){puDraft.sets[i]=t.value;return}
  if(f==="puden"){puDraft.sets[i].r=t.value;return}
  if(f==="pupyr"){puDraft.ladders[i].peak=t.value;return}
  if(f==="run"){runDraft[t.dataset.k]=t.value;return}
  if(f==="import"){importText=t.value;return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.a==="lift-sel"){liftSel=t.value;render();return}
  if(t.dataset.a==="lvl-set"){const k=t.dataset.k;setSkillLevel(k,+t.value);render();toast(`Training ${SKILLS[k].levels[S.skills[k].level]}. `+(S.skills[k].baseline?`Target ${holdTarget(k)} s from your record.`:"Test it next session."));return}
  if(t.id==="import-file"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{importText=String(r.result||"");render()};r.readAsText(t.files[0]);return}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.a;
  if(a!=="cancel-session"&&a!=="start"&&a!=="import-go"&&a!=="item-rm"&&a!=="load-prog"&&!a.startsWith("del"))confirmKey=null;
  switch(a){
    case "tab":if(b.dataset.k==="more")moreSub=null;tab=b.dataset.k;render();window.scrollTo(0,0);break;
    case "noop":break;
    case "prog-day":progDay=b.dataset.k||null;confirmKey=null;render();window.scrollTo(0,0);break;
    case "load-prog":{const id=b.dataset.k;if(session&&confirmKey!=="load-"+id){confirmKey="load-"+id;render();break}loadProgramDay(id);break}
    case "more-go":moreSub=b.dataset.k||null;progDay=null;render();window.scrollTo(0,0);break;
    case "pick-open":pick={cat:catOrder(session.split)[0]};render();break;
    case "pick-close":pick=null;render();break;
    case "pick-cat":pick.cat=b.dataset.k;render();break;
    case "pick-add":{const e=catalog().find(x=>x.n===b.dataset.n);if(!e)break;const id=uid()+session.order.length;session.order.push(id);session.slots[id]=makeSlot(e);pick=null;saveDraft();render();break}
    case "custom-add":{const n=($("#cust-name").value||"").trim();if(!n){toast("Type a name first");break}
      const e={n,cat:$("#cust-cat").value,k:$("#cust-kind").value};
      if(!catalog().some(x=>x.n.toLowerCase()===n.toLowerCase())){S.custom.mine=[...(S.custom.mine||[]),e];saveState()}
      const f=catalog().find(x=>x.n.toLowerCase()===n.toLowerCase());const id=uid()+session.order.length;session.order.push(id);session.slots[id]=makeSlot(f);pick=null;saveDraft();render();break}
    case "item-rm":{const id=b.dataset.slot;if(confirmKey==="rm-"+id){confirmKey=null;session.order=session.order.filter(x=>x!==id);delete session.slots[id];saveDraft();render()}else{confirmKey="rm-"+id;render()}break}
    case "day":selDay=selDay===b.dataset.k?null:b.dataset.k;render();break;
    case "weight-save":{const v=num($("#m-weight").value),dt=$("#m-date").value||today();if(!v){toast("Enter your weight in kg");break}await putLog({id:uid(),type:"weight",date:dt,ts:Date.parse(dt+"T12:00:00"),kg:v});render();toast("Weight saved");break}
    case "height-save":{const v=num($("#m-height").value);if(!v){toast("Enter your height in cm");break}S.metrics.height=v;editHeight=false;saveState();render();toast("Height saved");break}
    case "height-edit":editHeight=true;render();break;
    case "psub":psub=b.dataset.k;render();break;
    case "cal":calOff=Math.min(0,calOff+ +b.dataset.d);render();break;
    case "sheet-open":sheet=true;render();break;
    case "sheet-close":sheet=false;render();break;
    case "sheet-pu":sheet=false;tab="pullup";render();window.scrollTo(0,0);break;
    case "sheet-run":sheet=false;tab="run";render();window.scrollTo(0,0);break;
    case "resume":tab="session";render();window.scrollTo(0,0);break;
    case "timer-stop":clearInterval(tInt);tInt=null;$("#timer").hidden=true;break;
    case "timer-add":tEnd=Math.max(tEnd,Date.now())+30000;if(!tInt)tInt=setInterval(tick,250);tick();break;
    case "rest":startTimer(+b.dataset.s,"Rest");break;
    case "hold-timer":startTimer(+b.dataset.s,"Hold");break;
    case "start":if(session&&confirmKey!=="start"){confirmKey="start";toast("A session is in progress. Tap Start again to replace it.");break}confirmKey=null;sheet=false;session=newSession(b.dataset.k);tab="session";saveDraft();render();window.scrollTo(0,0);break;
    case "cancel-session":if(confirmKey==="cancel"){session=null;confirmKey=null;tab="today";try{localStorage.removeItem("hybrid-ppl-draft")}catch{};render()}else{confirmKey="cancel";render()}break;
    case "set-done":{const st=session.slots[b.dataset.slot].sets[+b.dataset.i];st.done=!st.done;saveDraft();render();break}
    case "set-rm":{session.slots[b.dataset.slot].sets.splice(+b.dataset.i,1);saveDraft();render();break}
    case "add-set":{const st=session.slots[b.dataset.slot];st.sets.push({w:"",r:"",s:"",done:false});saveDraft();render();break}
    case "skill-test":{const k=b.dataset.k,v=num($("#test-"+k).value);if(!v){toast("Enter your hold in seconds");break}
      await saveTest(k,v);session.slots[b.dataset.slot]=makeSlot({skill:k});saveDraft();render();toast(`Saved. Target: ${holdCount(k)} × ${holdTarget(k)} s`);break}
    case "finish":await finishSession();break;
    case "pu-open":tab="pullup";render();window.scrollTo(0,0);break;
    case "pu-den-done":{const s=puDraft.sets[+b.dataset.i];s.done=!s.done;render();if(s.done)startTimer(60,"Rest");break}
    case "pu-pyr-clean":{const x=puDraft.ladders[+b.dataset.i];x.clean=!x.clean;render();break}
    case "pu-pyr-done":{const x=puDraft.ladders[+b.dataset.i];x.done=!x.done;render();break}
    case "pu-save":await savePullups();break;
    case "pu-adj":{const f=b.dataset.f;S.pu[f]=Math.max(1,S.pu[f]+ +b.dataset.d);puDraft=null;saveState();render();break}
    case "pu-next":S.pu.next=b.dataset.k;puDraft=null;saveState();render();break;
    case "home":await toggleHome(b.dataset.k);break;
    case "prio":S.priority=b.dataset.k;saveState();render();break;
    case "sk-test":{const k=b.dataset.k,v=num($("#sk-test-"+k).value);if(!v){toast("Enter your hold in seconds");break}await saveTest(k,v);render();toast("Test saved");break}
    case "sk-level":{const k=b.dataset.k;setSkillLevel(k,S.skills[k].level+ +b.dataset.d);render();toast(`Now on ${SKILLS[k].levels[S.skills[k].level]}. `+(S.skills[k].baseline?`Target ${holdTarget(k)} s from your record.`:"Test it next session."));break}
    case "hang-test":{const l=num($("#hang-L").value),r=num($("#hang-R").value),t=num($("#hang-2").value);S.hang.d=S.hang.d||{};
      if(l){S.hang.L=l;S.hang.d.L=today()}if(r){S.hang.R=r;S.hang.d.R=today()}if(t){S.hang.two=t;S.hang.d.two=today()}saveState();render();toast("Saved");break}
    case "rec-save":{const k=b.dataset.k,v=num($("#sk-test-"+k).value);if(!v){toast("Enter your hold in seconds");break}
      const li=+$("#rec-lvl-"+k).value,band=$("#rec-band-"+k).checked,cur=li===S.skills[k].level&&!band;
      if(cur)await saveTest(k,v);else await putLog({id:uid(),type:"test",date:today(),ts:Date.now(),skill:SKILLS[k].name,level:SKILLS[k].levels[li]+(band?" (banded)":""),seconds:v});
      render();toast(cur?"Record saved, hold target updated":"Record saved");break}
    case "run-shin":runDraft.shin=!runDraft.shin;render();break;
    case "run-save":{const km=num(runDraft.km);if(!km){toast("Enter the distance");break}
      await putLog({id:uid(),type:"run",date:runDraft.date||today(),ts:Date.parse((runDraft.date||today())+"T12:00:00"),km,min:num(runDraft.min),shin:runDraft.shin,note:runDraft.note.trim()});
      runDraft={date:today(),km:"",min:"",shin:false,note:""};tab="today";render();window.scrollTo(0,0);toast("Run saved");break}
    case "del":{const id=b.dataset.id;if(confirmKey==="del-"+id){confirmKey=null;const dl=LOGS.find(x=>x.id===id);await delLog(id);if(dl&&dl.type==="test"){const sk=Object.keys(SKILLS).find(x=>SKILLS[x].name===dl.skill);if(sk)setSkillLevel(sk,S.skills[sk].level)}render()}else{confirmKey="del-"+id;render()}break}
    case "export":showExport=!showExport;render();break;
    case "download":{const blob=new Blob([JSON.stringify({state:S,logs:LOGS},null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);const x=document.createElement("a");x.href=u;x.download=`training-backup-${today()}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case "import-toggle":showImport=!showImport;importText="";render();break;
    case "import-go":{let d;try{d=JSON.parse(importText)}catch{toast("That isn't valid backup JSON");break}
      if(!d||!d.state||!Array.isArray(d.logs)){toast("Backup must contain state and logs");break}
      if(confirmKey!=="import"){confirmKey="import";render();break}
      confirmKey=null;S=Object.assign(clone(DEFAULT_STATE),d.state);LOGS=d.logs;sortLogs();migrate();lsSet(LKEY,{state:S,logs:LOGS});showImport=false;importText="";render();toast("Backup restored");break}
    case "copy-export":{const box=$("#export-box");try{await navigator.clipboard.writeText(box.value);toast("Copied")}catch{box.focus();box.select();toast("Selected. Copy it manually.")}break}
  }
});

function setSkillLevel(k,i){
  const sk=S.skills[k];sk.level=Math.min(SKILLS[k].levels.length-1,Math.max(0,i));
  const r=skillRecords()[SKILLS[k].name+" · "+SKILLS[k].levels[sk.level]];
  sk.baseline=r?r.s:null;sk.target=r?Math.max(2,Math.round(r.s*.7)):null;saveState();
}
async function saveTest(k,v){
  const sk=S.skills[k];sk.baseline=v;sk.target=Math.max(2,Math.round(v*.7));saveState();
  await putLog({id:uid(),type:"test",date:today(),ts:Date.now(),skill:SKILLS[k].name,level:SKILLS[k].levels[sk.level],seconds:v});
}
async function toggleHome(id){
  const date=today();const h=clone(homeLog(date)||{id:"home-"+date,type:"home",date,ts:Date.now(),done:[]});
  h.done=h.done.includes(id)?h.done.filter(x=>x!==id):[...h.done,id];await putLog(h);render();
}
async function finishSession(){
  const k=session.split,items=[];let msgs=[];
  for(const id of session.order){
    const st=session.slots[id],df=st.def;
    if(df.skill){
      if(!S.skills[df.skill].baseline)continue;
      const holds=st.sets.filter(s=>s.done).map(s=>num(s.s)||0);if(!holds.length)continue;
      const sk=S.skills[df.skill],t=holdTarget(df.skill);
      items.push({slot:df.key,ex:st.ex,kind:"hold",sets:holds.map(s=>({s}))});
      if(holds.length>=st.sets.length&&holds.every(h=>h>=t)){sk.target=t+1;msgs.push(`${SKILLS[df.skill].name} target → ${t+1} s`)}
      if(Math.max(...holds)>sk.baseline)sk.baseline=Math.max(...holds);
      continue;
    }
    const kind=df.kind;
    const sets=st.sets.filter(s=>s.r!==""||s.s!==""||s.w!=="").map(s=>kind==="lift"?{w:num(s.w),r:num(s.r)}:kind==="hold"?{s:num(s.s)}:{r:num(s.r)});
    if(!sets.length)continue;
    items.push({slot:df.key,ex:st.ex,kind,sets});
    if(df.key==="oah"){st.sets.forEach((s,i)=>{const v=num(s.s);if(!v)return;const side=i%2?"R":"L";if(v>(S.hang[side]||0)){S.hang[side]=v;(S.hang.d=S.hang.d||{})[side]=today()}})}
    if(df.key==="tah"){const m=Math.max(0,...st.sets.map(x=>num(x.s)||0));if(m>(S.hang.two||0)){S.hang.two=m;(S.hang.d=S.hang.d||{}).two=today()}}
  }
  if(!items.length){toast("Log at least one set before finishing");return}
  await putLog({id:uid(),type:"session",split:k,date:session.date,ts:Date.now(),min:Math.round((Date.now()-session.started)/60000),items});
  S.nextSplit=ORDER[(ORDER.indexOf(k)+1)%3];saveState();
  session=null;try{localStorage.removeItem("hybrid-ppl-draft")}catch{};tab="today";render();window.scrollTo(0,0);
  toast(["Session saved",...msgs].join(" · "));
}
async function savePullups(){
  const d=puDraft;let log={id:uid(),type:"pullup",date:today(),ts:Date.now(),day:d.day},msg="Saved";
  if(d.day==="max"){const sets=d.sets.map(num).filter(v=>v!=null);if(sets.length<1){toast("Enter your sets");return}log.sets=sets;
    const half=Math.floor(sets[0]/2);if(half>S.pu.densityTarget)msg=`Saved. Half your max is ${half}; the rule keeps you at ${S.pu.densityTarget} until you complete 10 × ${S.pu.densityTarget}.`}
  else if(d.day==="density"){const sets=d.sets.filter(s=>s.done||s.r!=="").map(s=>num(s.r)||0);if(!sets.length){toast("Tick your sets");return}
    log.target=d.target;log.sets=sets;
    if(sets.length>=10&&sets.slice(0,10).every(r=>r>=d.target)){S.pu.densityTarget=d.target+1;msg=`All 10 done. Next density target: 10 × ${d.target+1}`}}
  else {const lad=d.ladders.filter(x=>x.done).map(x=>{const p=num(x.peak)||0;return{peak:p,reps:x.clean?p*p:null,clean:x.clean}});if(!lad.length){toast("Tick your ladders");return}
    lad.forEach(x=>{if(x.reps==null)x.reps=Math.round(x.peak*x.peak*.7)});log.ladders=lad;
    if(lad.length>=5&&lad.every(x=>x.clean&&x.peak>=d.peak)){S.pu.ladderPeak=d.peak+1;msg=`Five clean ladders. Next peak: ${d.peak+1}`}
    else if(lad.some(x=>!x.clean))log.note="Failed ladders are counted at about 70% of their full reps.";}
  S.pu.next=PU_NEXT[d.day];await putLog(log);saveState();puDraft=null;tab=session?"session":"today";render();window.scrollTo(0,0);toast(msg);
}

init();
const APP_VERSION="v14"; // keep in sync with VERSION in sw.js
let hiddenAt=0;
if("serviceWorker" in navigator){window.addEventListener("load",()=>{
  let had=!!navigator.serviceWorker.controller, reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloading){reloading=true;location.reload()}had=true});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}
      reg.update().catch(()=>{});
      if(hiddenAt&&Date.now()-hiddenAt>30*60*1000&&tab!=="today"){tab="today";render()}
    });
  }).catch(()=>{});
})}
